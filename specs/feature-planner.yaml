systems:
  name: feature-planner
  description: 'Feature planning and implementation system using Planner-Executor pattern.
    A planner decomposes a feature request into tasks, a developer implements them,
    and a QA verifier validates the implementation against requirements.
  
    '
  target: langgraph
  pattern: planner_executor
  model: gpt-4o
  example_input: 'Build a user authentication module with login, registration, password
    reset, and email verification. Use JWT tokens for session management.
  
    '
  agents:
  - name: planner
    instructions: 'You are a technical planner. Decompose the feature request into a
      clear, step-by-step implementation plan. For each step, specify: the task description,
      dependencies on other steps, files or components to create/modify, and expected
      output. Consider architecture, data flow, error handling, and security from the
      start.
  
      '
  - name: developer
    instructions: 'You are a full-stack developer. Implement the features described
      in the plan. Write clean, testable, and secure code following best practices.
      Consider edge cases, error handling, input validation, and security throughout
      implementation.
  
      '
  - name: qa_verifier
    instructions: 'You are a QA engineer and verifier. Review the implementation against
      the original requirements and plan. Assess: COMPLETENESS (all features addressed),
      QUALITY (code standards, edge cases, security), and GAPS (missing pieces or unresolved
      items). Provide a final verdict: APPROVED, PARTIALLY_APPROVED (with notes), or
      NEEDS_REVISION.
  
      '
